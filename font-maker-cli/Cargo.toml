[package]
name = "font-maker-cli"
version = "0.1.0"
edition = "2021"

[lib]
name = "font_maker_cli"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "font-maker-cli"
path = "src/main.rs"

[dependencies]
font-maker-core = { path = "../font-maker-core", features = ["alloc"] }
font-consumer = { path = "../font-consumer" }
clap = { version = "4", features = ["derive"] }
png = "0.17"
embedded-graphics = "0.8"
embedded-graphics-simulator = { version = "0.6", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["console"] }
